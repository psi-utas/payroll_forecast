# Streamlit authentication config for Microsoft Entra ID.
# See: https://docs.streamlit.io/develop/concepts/connections/authentication
#
# This file is committed with placeholders only. The deploy workflow replaces
# each ${...} placeholder with a Gitea Actions secret before copying to the
# server. Never commit real values here.

[auth]
# Must exactly match a "Web" redirect URI on the Entra app registration.
redirect_uri = "https://payrollforecast.utas.edu.au/oauth2callback"

# A strong random string used to sign the identity cookie. Keep it stable
# between deploys or everyone is logged out. Generate with:
#   python3 -c "import secrets; print(secrets.token_hex(32))"
cookie_secret = "${PAYROLL_COOKIE_SECRET}"

# The name "microsoft" matches st.login("microsoft") in app.py.
[auth.microsoft]
client_id = "${PAYROLL_ENTRA_CLIENT_ID}"
client_secret = "${PAYROLL_ENTRA_CLIENT_SECRET}"
# Using the tenant ID (not "common"/"organizations") restricts sign-in to
# accounts in the UTAS tenant.
server_metadata_url = "https://login.microsoftonline.com/${PAYROLL_ENTRA_TENANT_ID}/v2.0/.well-known/openid-configuration"
